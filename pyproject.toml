[project]
name = "saffron-cut"
version = "0.1.0"
description = "RefineDet-based center+angle detector for saffron flowers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[project.scripts]
saffron-cut = "saffron_cut:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
